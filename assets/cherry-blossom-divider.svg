<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-labelledby="title desc">
  <title id="title">Cherry blossom divider</title>
  <desc id="desc">A subtle animated row of falling cherry blossoms</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7aa2" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ff7aa2" stop-opacity="0.58" />
      <stop offset="1" stop-color="#ff7aa2" stop-opacity="0" />
    </linearGradient>
    <path id="petal" d="M0 0 C-6-11-17-8-16 2 C-14 11-4 14 0 0 Z" />
  </defs>
  <rect x="120" y="42" width="960" height="1" fill="url(#line)" />
  <g fill="#ff8eae">
    <g><use href="#petal" /><animateTransform attributeName="transform" type="translate" values="190 -18;235 100" dur="6.8s" repeatCount="indefinite" /></g>
    <g opacity="0.58"><use href="#petal" transform="scale(.7)" /><animateTransform attributeName="transform" type="translate" values="405 -32;360 96" dur="8.4s" begin="-3s" repeatCount="indefinite" /></g>
    <g opacity="0.8"><use href="#petal" transform="scale(.82)" /><animateTransform attributeName="transform" type="translate" values="600 -20;650 104" dur="7.5s" begin="-5s" repeatCount="indefinite" /></g>
    <g opacity="0.62"><use href="#petal" transform="scale(.64)" /><animateTransform attributeName="transform" type="translate" values="810 -28;760 98" dur="8.9s" begin="-7s" repeatCount="indefinite" /></g>
    <g opacity="0.9"><use href="#petal" transform="scale(.9)" /><animateTransform attributeName="transform" type="translate" values="1010 -22;1050 100" dur="7.1s" begin="-2s" repeatCount="indefinite" /></g>
  </g>
</svg>
